server {
    listen 80;
    # Replace `_` with your domain in the server-only copy on the droplet.
    server_name _;
    root /var/www/clinic-manager/frontend;
    index today.html;

    location / {
        # Keep extensionless page URLs in the browser while serving the matching HTML file.
        try_files $uri $uri/ $uri.html /today.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8017/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8017/health;
        proxy_set_header Host $host;
    }
}
